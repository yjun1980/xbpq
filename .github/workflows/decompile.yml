name: Decompile xbpq

on:
  # ★ 自动触发：push JAR 或 workflow 本身
  push:
    paths:
      - '**/*.jar'
      - '.github/workflows/decompile.yml'

  # ★ 手动触发：可以自定义参数
  workflow_dispatch:
    inputs:
      jar_file:
        description: '要反编译的 JAR 文件名'
        required: false
        default: 'xbpq.jar'
      output_dir:
        description: '输出目录（留空自动生成）'
        required: false
        default: ''
      upload_artifact:
        description: '是否上传 artifact'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

env:
  CFR_VERSION: '0.152'
  PROCYON_VERSION: '0.6.0'

jobs:
  # ==================== 探测 JAR ====================
  detect:
    runs-on: ubuntu-latest
    outputs:
      jar_file: ${{ steps.find.outputs.jar_file }}
      out_dir: ${{ steps.find.outputs.out_dir }}
      is_manual: ${{ steps.find.outputs.is_manual }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find JAR
        id: find
        run: |
          set -e
          # 手动触发时优先用手动输入
          if [ -n "${{ github.event.inputs.jar_file }}" ]; then
            JAR="${{ github.event.inputs.jar_file }}"
            OUT="${{ github.event.inputs.output_dir }}"
            IS_MANUAL=true
          else
            # 自动触发：自动探测
            if [ -f "xbpq.jar" ]; then
              JAR="xbpq.jar"
            else
              JAR=$(find . -maxdepth 2 -name "*.jar" ! -path "./tools/*" | head -1)
            fi
            OUT=""
            IS_MANUAL=false
          fi

          if [ -z "$JAR" ]; then
            echo "❌ 没找到 JAR"
            exit 1
          fi
          if [ ! -f "$JAR" ]; then
            echo "❌ 找不到 $JAR"
            exit 1
          fi

          # 输出目录
          if [ -z "$OUT" ]; then
            OUT="$(basename "$JAR" .jar)-src"
          fi

          echo "jar_file=$JAR" >> $GITHUB_OUTPUT
          echo "out_dir=$OUT" >> $GITHUB_OUTPUT
          echo "is_manual=$IS_MANUAL" >> $GITHUB_OUTPUT
          echo "📦 JAR: $JAR"
          echo "📁 输出: $OUT"
          echo "🖐 手动: $IS_MANUAL"

  # ==================== 反编译 ====================
  decompile:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAR_FILE: ${{ needs.detect.outputs.jar_file }}
      OUT_DIR: ${{ needs.detect.outputs.out_dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Setup
        run: |
          mkdir -p tools
          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV
          echo "OUT_DIR=$OUT_DIR" >> $GITHUB_ENV
          echo "📦 $JAR_FILE"
          echo "📁 $OUT_DIR"

      # ---------- 校验 ----------
      - name: Validate JAR
        id: validate
        run: |
          set -e
          SIZE=$(stat -c%s "$JAR_FILE")
          echo "大小: $SIZE bytes"
          [ "$SIZE" -gt 1000 ] || { echo "❌ JAR 太小"; exit 1; }
          unzip -l "$JAR_FILE" > /dev/null || { echo "❌ 非法 zip"; exit 1; }
          echo "✅ 校验通过"
          echo "class_count=$(unzip -l "$JAR_FILE" | grep -c '\.class$' || true)" >> $GITHUB_OUTPUT

      # ---------- 下载 CFR ----------
      - name: Download CFR
        id: cfr
        run: |
          set -e
          URLS=(
            "https://www.benf.org/other/cfr/cfr-${CFR_VERSION}.jar"
            "https://github.com/leibnitz27/cfr/releases/download/${CFR_VERSION}/cfr-${CFR_VERSION}.jar"
            "https://repo1.maven.org/maven2/org/benf/cfr/${CFR_VERSION}/cfr-${CFR_VERSION}.jar"
          )
          for url in "${URLS[@]}"; do
            echo "尝试: $url"
            if curl -fSL --retry 3 --retry-delay 2 --connect-timeout 10 \
              -o tools/cfr.jar "$url" && [ -s tools/cfr.jar ]; then
              echo "cfr_ok=true" >> $GITHUB_OUTPUT
              echo "✅ CFR 下载成功"
              exit 0
            fi
          done
          echo "cfr_ok=false" >> $GITHUB_OUTPUT
          echo "❌ CFR 下载失败"

      # ---------- CFR 反编译 ----------
      - name: Decompile with CFR
        id: cfr_decompile
        if: steps.cfr.outputs.cfr_ok == 'true'
        continue-on-error: true
        run: |
          set -e
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          java -Xmx4g -jar tools/cfr.jar "$JAR_FILE" \
            --outputdir "$OUT_DIR" \
            --comments false \
            --lenient true \
            --lifting true \
            --decodelambdas true \
            --decodestringswitch true \
            --decodeenumswitch true \
            --decodefinally true \
            --hidebridgemethods true \
            --innerclasses true \
            --caseinsensitivefs true \
            --silent true || echo "CFR 有警告，继续"
          echo "CFR 文件数: $(find "$OUT_DIR" -name '*.java' | wc -l)"

      # ---------- 检查 CFR ----------
      - name: Check CFR
        id: check_cfr
        if: steps.cfr_decompile.outcome == 'success'
        run: |
          set -e
          COUNT=$(find "$OUT_DIR" -name '*.java' | wc -l)
          if [ "$COUNT" -lt 5 ]; then
            echo "cfr_good=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          UNSUP=$(grep -rl "UnsupportedOperationException" "$OUT_DIR" 2>/dev/null | wc -l || true)
          if [ "$UNSUP" -gt 0 ]; then
            echo "cfr_good=partial" >> $GITHUB_OUTPUT
          else
            echo "cfr_good=true" >> $GITHUB_OUTPUT
          fi

      # ---------- Fallback: Procyon ----------
      - name: Download Procyon
        id: procyon
        if: steps.check_cfr.outputs.cfr_good != 'true'
        continue-on-error: true
        run: |
          set -e
          URL="https://github.com/mstrobel/procyon/releases/download/v${PROCYON_VERSION}/procyon-decompiler-${PROCYON_VERSION}.jar"
          if curl -fSL --retry 3 --retry-delay 2 -o tools/procyon.jar "$URL"; then
            echo "procyon_ok=true" >> $GITHUB_OUTPUT
          else
            echo "procyon_ok=false" >> $GITHUB_OUTPUT
          fi

      - name: Decompile with Procyon
        id: procyon_decompile
        if: steps.procyon.outputs.procyon_ok == 'true' && steps.check_cfr.outputs.cfr_good != 'true'
        continue-on-error: true
        run: |
          set -e
          rm -rf "${OUT_DIR}_procyon"
          mkdir -p "${OUT_DIR}_procyon"
          java -Xmx4g -jar tools/procyon.jar -jar "$JAR_FILE" -o "${OUT_DIR}_procyon" || true
          echo "Procyon 文件数: $(find "${OUT_DIR}_procyon" -name '*.java' | wc -l)"

      # ---------- 选最佳 ----------
      - name: Pick best
        id: pick
        run: |
          set -e
          BEST=""
          BEST_SCORE=-999999
          for dir in "$OUT_DIR" "${OUT_DIR}_procyon"; do
            if [ -d "$dir" ]; then
              COUNT=$(find "$dir" -name '*.java' | wc -l)
              UNSUP=$(grep -rl "UnsupportedOperationException" "$dir" 2>/dev/null | wc -l || true)
              SCORE=$((COUNT - UNSUP * 10))
              echo "$dir: count=$COUNT unsup=$UNSUP score=$SCORE"
              if [ "$SCORE" -gt "$BEST_SCORE" ]; then
                BEST="$dir"
                BEST_SCORE="$SCORE"
              fi
            fi
          done
          [ -n "$BEST" ] || { echo "❌ 没结果"; exit 1; }
          echo "best_dir=$BEST" >> $GITHUB_OUTPUT
          if [ "$BEST" != "$OUT_DIR" ]; then
            rm -rf "${OUT_DIR}_old"
            mv "$OUT_DIR" "${OUT_DIR}_old" 2>/dev/null || true
            cp -r "$BEST" "$OUT_DIR"
          fi

      # ---------- 深度检查 ----------
      - name: Deep check
        id: deep
        run: |
          set -e
          XBPQ_FILE=$(find "$OUT_DIR" -name "XBPQ.java" | head -1)
          if [ -z "$XBPQ_FILE" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          LINES=$(wc -l < "$XBPQ_FILE")
          UNSUP=$(grep -c "UnsupportedOperationException" "$XBPQ_FILE" || true)
          echo "found=true" >> $GITHUB_OUTPUT
          echo "xbpq_file=$XBPQ_FILE" >> $GITHUB_OUTPUT
          echo "xbpq_lines=$LINES" >> $GITHUB_OUTPUT
          echo "xbpq_unsup=$UNSUP" >> $GITHUB_OUTPUT
          echo "📄 XBPQ.java: $LINES 行, $UNSUP 处缺失"

          echo ""
          echo "=== 关键方法 ==="
          for m in "W(" "detailContent(" "playerContent(" "searchContent(" "homeContent(" "categoryContent("; do
            grep -q "$m" "$XBPQ_FILE" && echo "✅ $m" || echo "❌ $m"
          done

      # ---------- 生成报告 ----------
      - name: Report
        if: always()
        run: |
          {
            echo "# Decompile Report"
            echo ""
            echo "## 触发方式"
            echo "- 手动: ${{ needs.detect.outputs.is_manual }}"
            echo "- JAR: \`$JAR_FILE\`"
            echo ""
            echo "## 输入"
            echo "- 大小: $(stat -c%s "$JAR_FILE" 2>/dev/null || echo N/A) bytes"
            echo "- class 数: ${{ steps.validate.outputs.class_count }}"
            echo ""
            echo "## 输出"
            echo "- 最佳目录: \`${{ steps.pick.outputs.best_dir }}\`"
            echo "- Java 文件数: $(find "$OUT_DIR" -name '*.java' 2>/dev/null | wc -l)"
            echo "- XBPQ.java: ${{ steps.deep.outputs.xbpq_lines }} 行"
            echo "- UnsupportedOperationException: ${{ steps.deep.outputs.xbpq_unsup }}"
            echo ""
            echo "## 工具"
            echo "- CFR: ${{ steps.cfr.outputs.cfr_ok }}"
            echo "- Procyon: ${{ steps.procyon.outputs.procyon_ok }}"
            echo ""
            echo "## 时间"
            echo "- $(date -u)"
          } > DECOMPILE_REPORT.md
          cat DECOMPILE_REPORT.md

      # ---------- 自动提交 ----------
      - name: Auto commit
        if: steps.deep.outputs.found == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT_DIR/"
          git add DECOMPILE_REPORT.md
          if git diff --cached --quiet; then
            echo "没有变化，跳过"
          else
            MODE="${{ needs.detect.outputs.is_manual }}"
            if [ "$MODE" = "true" ]; then
              MSG="🤖 [手动] 反编译 $JAR_FILE $(date +%Y%m%d_%H%M%S)"
            else
              MSG="🤖 [自动] 反编译 $JAR_FILE $(date +%Y%m%d_%H%M%S)"
            fi
            git commit -m "$MSG"
            git push
            echo "✅ 已推送"
          fi

      # ---------- 上传 artifact ----------
      - name: Zip
        if: always()
        run: |
          zip -rq decompiled.zip "$OUT_DIR" DECOMPILE_REPORT.md || true
          ls -lh decompiled.zip || true

      - name: Upload artifact
        if: always() && (github.event.inputs.upload_artifact != 'false' || github.event_name != 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-${{ github.run_id }}
          path: |
            decompiled.zip
            DECOMPILE_REPORT.md
          retention-days: 30

      - name: Upload XBPQ.java
        if: steps.deep.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: XBPQ-java-${{ github.run_id }}
          path: ${{ steps.deep.outputs.xbpq_file }}
          retention-days: 30