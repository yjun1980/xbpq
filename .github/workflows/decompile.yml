name: Decompile xbpq

on:
  push:
    paths:
      - '**/*.jar'
      - '.github/workflows/decompile.yml'
  workflow_dispatch:
    inputs:
      jar_file:
        description: '要反编译的 JAR 文件名'
        required: false
        default: 'xbpq.jar'
      output_dir:
        description: '输出目录'
        required: false
        default: ''

permissions:
  contents: write

env:
  CFR_VERSION: '0.152'
  DEX2JAR_VERSION: '2.4'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      jar_file: ${{ steps.find.outputs.jar_file }}
      out_dir: ${{ steps.find.outputs.out_dir }}
      is_manual: ${{ steps.find.outputs.is_manual }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Find JAR
        id: find
        run: |
          set -e
          if [ -n "${{ github.event.inputs.jar_file }}" ]; then
            JAR="${{ github.event.inputs.jar_file }}"
            OUT="${{ github.event.inputs.output_dir }}"
            IS_MANUAL=true
          else
            if [ -f "xbpq.jar" ]; then
              JAR="xbpq.jar"
            else
              JAR=$(find . -maxdepth 2 -name "*.jar" ! -path "./tools/*" ! -path "./.git/*" | head -1)
            fi
            OUT=""
            IS_MANUAL=false
          fi
          [ -f "$JAR" ] || { echo "❌ 找不到 $JAR"; exit 1; }
          [ -z "$OUT" ] && OUT="$(basename "$JAR" .jar)-src"
          echo "jar_file=$JAR" >> $GITHUB_OUTPUT
          echo "out_dir=$OUT" >> $GITHUB_OUTPUT
          echo "is_manual=$IS_MANUAL" >> $GITHUB_OUTPUT

  decompile:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAR_FILE: ${{ needs.detect.outputs.jar_file }}
      OUT_DIR: ${{ needs.detect.outputs.out_dir }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup
        run: |
          mkdir -p tools
          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV
          echo "OUT_DIR=$OUT_DIR" >> $GITHUB_ENV

      # ---------- 校验 JAR ----------
      - name: Validate JAR
        id: validate
        run: |
          set -e
          [ -f "$JAR_FILE" ] || { echo "❌ 找不到 JAR"; exit 1; }
          SIZE=$(stat -c%s "$JAR_FILE")
          echo "大小: $SIZE bytes"
          echo "class_count=$(unzip -l "$JAR_FILE" | grep -c '\.class$' || true)" >> $GITHUB_OUTPUT
          echo "dex_count=$(unzip -l "$JAR_FILE" | grep -c '\.dex$' || true)" >> $GITHUB_OUTPUT
          echo "nested_count=$(unzip -l "$JAR_FILE" | grep -c '\.jar$' || true)" >> $GITHUB_OUTPUT

      # ---------- 如果 JAR 里是 DEX，先转 JAR ----------
      - name: Convert DEX to JAR
        id: dex2jar
        if: steps.validate.outputs.dex_count > 0 && steps.validate.outputs.class_count == '0'
        run: |
          set -e
          # 下载 dex2jar
          curl -fSL --retry 3 -o tools/dex2jar.zip \
            "https://github.com/pxb1988/dex2jar/releases/download/v${DEX2JAR_VERSION}/dex-tools-v${DEX2JAR_VERSION}.zip"
          unzip -q tools/dex2jar.zip -d tools/
          D2J_DIR=$(find tools -maxdepth 2 -name "d2j-dex2jar.sh" | head -1 | xargs dirname)
          chmod +x "$D2J_DIR"/*.sh
          # 提取 classes.dex
          rm -rf dex_extract
          mkdir -p dex_extract
          cd dex_extract
          unzip -o "../$JAR_FILE" "*.dex" || true
          cd ..
          DEX_FILES=$(find dex_extract -name "*.dex")
          echo "找到 DEX: $DEX_FILES"
          # 转成 JAR
          rm -f xbpq-classes.jar
          "$D2J_DIR/d2j-dex2jar.sh" -o xbpq-classes.jar $DEX_FILES --force || \
            "$D2J_DIR/d2j-dex2jar.sh" -o xbpq-classes.jar dex_extract/classes.dex --force
          ls -lh xbpq-classes.jar
          echo "converted=true" >> $GITHUB_OUTPUT

      # ---------- 下载 CFR ----------
      - name: Download CFR
        id: cfr
        run: |
          set -e
          URLS=(
            "https://www.benf.org/other/cfr/cfr-${CFR_VERSION}.jar"
            "https://github.com/leibnitz27/cfr/releases/download/${CFR_VERSION}/cfr-${CFR_VERSION}.jar"
            "https://repo1.maven.org/maven2/org/benf/cfr/${CFR_VERSION}/cfr-${CFR_VERSION}.jar"
          )
          for url in "${URLS[@]}"; do
            if curl -fSL --retry 3 --retry-delay 2 -o tools/cfr.jar "$url" && [ -s tools/cfr.jar ]; then
              echo "cfr_ok=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "cfr_ok=false" >> $GITHUB_OUTPUT

      # ---------- 选实际要反编译的文件 ----------
      - name: Choose target
        id: target
        run: |
          if [ "${{ steps.dex2jar.outputs.converted }}" = "true" ] && [ -f "xbpq-classes.jar" ]; then
            echo "target=xbpq-classes.jar" >> $GITHUB_OUTPUT
            echo "✅ 使用转换后的 JAR"
          else
            echo "target=$JAR_FILE" >> $GITHUB_OUTPUT
            echo "✅ 使用原 JAR"
          fi

      # ---------- CFR 反编译 ----------
      - name: Decompile with CFR
        id: cfr_decompile
        if: steps.cfr.outputs.cfr_ok == 'true'
        continue-on-error: true
        run: |
          set -e
          TARGET="${{ steps.target.outputs.target }}"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          java -Xmx4g -jar tools/cfr.jar "$TARGET" \
            --outputdir "$OUT_DIR" \
            --comments false \
            --lenient true \
            --lifting true \
            --decodelambdas true \
            --decodestringswitch true \
            --decodeenumswitch true \
            --decodefinally true \
            --hidebridgemethods true \
            --innerclasses true \
            --caseinsensitivefs true \
            --silent true || echo "CFR 有警告"
          echo "CFR 文件数: $(find "$OUT_DIR" -name '*.java' | wc -l)"

      # ---------- Fallback Procyon ----------
      - name: Procyon fallback
        id: procyon
        if: steps.cfr.outputs.cfr_ok != 'true' || steps.cfr_decompile.outcome != 'success'
        continue-on-error: true
        run: |
          set -e
          TARGET="${{ steps.target.outputs.target }}"
          curl -fSL -o tools/procyon.jar \
            "https://github.com/mstrobel/procyon/releases/download/v0.6.0/procyon-decompiler-0.6.0.jar" || exit 0
          rm -rf "${OUT_DIR}_procyon"
          mkdir -p "${OUT_DIR}_procyon"
          java -Xmx4g -jar tools/procyon.jar -jar "$TARGET" -o "${OUT_DIR}_procyon" || true
          echo "Procyon 文件数: $(find "${OUT_DIR}_procyon" -name '*.java' 2>/dev/null | wc -l)"
          echo "procyon_done=true" >> $GITHUB_OUTPUT

      # ---------- 选最佳 ----------
      - name: Pick best
        id: pick
        run: |
          set -e
          BEST=""
          BEST_SCORE=-999999
          for dir in "$OUT_DIR" "${OUT_DIR}_procyon"; do
            if [ -d "$dir" ]; then
              COUNT=$(find "$dir" -name '*.java' | wc -l)
              UNSUP=$(grep -rl "UnsupportedOperationException" "$dir" 2>/dev/null | wc -l || true)
              SCORE=$((COUNT - UNSUP * 10))
              echo "$dir: count=$COUNT unsup=$UNSUP score=$SCORE"
              [ "$SCORE" -gt "$BEST_SCORE" ] && { BEST="$dir"; BEST_SCORE="$SCORE"; }
            fi
          done
          [ -n "$BEST" ] || { echo "❌ 没结果"; exit 1; }
          echo "best_dir=$BEST" >> $GITHUB_OUTPUT
          if [ "$BEST" != "$OUT_DIR" ]; then
            rm -rf "${OUT_DIR}_old"
            mv "$OUT_DIR" "${OUT_DIR}_old" 2>/dev/null || true
            cp -r "$BEST" "$OUT_DIR"
          fi

      # ---------- 深度检查 ----------
      - name: Deep check
        id: deep
        run: |
          set -e
          XBPQ_FILE=$(find "$OUT_DIR" -name "XBPQ.java" | head -1)
          if [ -z "$XBPQ_FILE" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            echo "❌ 找不到 XBPQ.java"
            echo "=== 现有 Java 文件 ==="
            find "$OUT_DIR" -name "*.java" | head -30
            exit 0
          fi
          LINES=$(wc -l < "$XBPQ_FILE")
          UNSUP=$(grep -c "UnsupportedOperationException" "$XBPQ_FILE" || true)
          echo "found=true" >> $GITHUB_OUTPUT
          echo "xbpq_file=$XBPQ_FILE" >> $GITHUB_OUTPUT
          echo "xbpq_lines=$LINES" >> $GITHUB_OUTPUT
          echo "xbpq_unsup=$UNSUP" >> $GITHUB_OUTPUT
          echo "📄 XBPQ.java: $LINES 行, $UNSUP 处缺失"

      # ---------- 报告 ----------
      - name: Report
        if: always()
        run: |
          {
            echo "# Decompile Report"
            echo ""
            echo "## 输入"
            echo "- JAR: \`$JAR_FILE\`"
            echo "- 大小: $(stat -c%s "$JAR_FILE" 2>/dev/null || echo N/A) bytes"
            echo "- class 数: ${{ steps.validate.outputs.class_count }}"
            echo "- dex 数: ${{ steps.validate.outputs.dex_count }}"
            echo "- 嵌套 JAR: ${{ steps.validate.outputs.nested_count }}"
            echo "- DEX 转换: ${{ steps.dex2jar.outputs.converted }}"
            echo ""
            echo "## 输出"
            echo "- 最佳目录: \`${{ steps.pick.outputs.best_dir }}\`"
            echo "- Java 文件数: $(find "$OUT_DIR" -name '*.java' 2>/dev/null | wc -l)"
            echo "- XBPQ.java: ${{ steps.deep.outputs.xbpq_lines }} 行"
            echo "- UnsupportedOperationException: ${{ steps.deep.outputs.xbpq_unsup }}"
            echo ""
            echo "## 时间"
            echo "- $(date -u)"
          } > DECOMPILE_REPORT.md
          cat DECOMPILE_REPORT.md

      # ---------- 提交 ----------
      - name: Auto commit
        if: steps.deep.outputs.found == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT_DIR/"
          git add DECOMPILE_REPORT.md
          git diff --cached --quiet && echo "无变化" || {
            git commit -m "🤖 [${{ needs.detect.outputs.is_manual == 'true' && '手动' || '自动' }}] DEX→JAR 反编译 $JAR_FILE"
            git push
          }

      # ---------- 上传 ----------
      - name: Zip
        if: always()
        run: |
          zip -rq decompiled.zip "$OUT_DIR" DECOMPILE_REPORT.md || true
          ls -lh decompiled.zip || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: decompiled-${{ github.run_id }}
          path: |
            decompiled.zip
            DECOMPILE_REPORT.md
          retention-days: 30

      - name: Upload XBPQ.java
        if: steps.deep.outputs.found == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: XBPQ-java-${{ github.run_id }}
          path: ${{ steps.deep.outputs.xbpq_file }}
          retention-days: 30
