name: Decompile xbpq

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ★ 用 xbpq.jar（小写）
      - name: Check xbpq.jar
        run: |
          ls -lh xbpq.jar
          file xbpq.jar

      - name: Download jadx
        run: |
          curl -L -o jadx.zip "https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip"
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx
          ./jadx/bin/jadx --version

      # ★ 反编译 xbpq.jar → xbpq-src/
      - name: Decompile
        run: |
          rm -rf xbpq-src
          ./jadx/bin/jadx -d xbpq-src xbpq.jar
          echo "=== 反编译结果 ==="
          find xbpq-src -name "*.java" | head -30
          echo "=== 总文件数 ==="
          find xbpq-src -name "*.java" | wc -l

      # ★ 提交回仓库
      - name: Commit decompiled source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add xbpq-src/
          git commit -m "反编译 xbpq.jar 源码 $(date +%Y%m%d_%H%M%S)" || echo "no changes"
          git push

      - name: Zip
        run: zip -r xbpq-decompiled.zip xbpq-src

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: xbpq-decompiled
          path: xbpq-decompiled.zip
          retention-days: 30