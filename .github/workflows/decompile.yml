name: Diagnose xbpq.jar

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # ========== 1. 看仓库里有什么 ==========
      - name: Repo files
        run: |
          echo "=== 仓库根目录 ==="
          ls -la
          echo ""
          echo "=== 所有 JAR ==="
          find . -name "*.jar" -not -path "./.git/*" -exec ls -lh {} \;

      # ========== 2. 看 JAR 里有什么 ==========
      - name: JAR contents
        run: |
          echo "=== class 总数 ==="
          unzip -l xbpq.jar | grep -c "\.class" || echo "0"
          echo ""
          echo "=== 是否有 XBPQ ==="
          unzip -l xbpq.jar | grep -i "XBPQ" || echo "❌ 没有 XBPQ"
          echo ""
          echo "=== 是否有 spider 包 ==="
          unzip -l xbpq.jar | grep "catvod/spider" | head -20 || echo "❌ 没有 spider 包"
          echo ""
          echo "=== 是否有嵌套 JAR ==="
          unzip -l xbpq.jar | grep "\.jar" || echo "无嵌套 JAR"
          echo ""
          echo "=== 是否有 DEX ==="
          unzip -l xbpq.jar | grep -i "\.dex" || echo "无 DEX"
          echo ""
          echo "=== 前 30 个 class ==="
          unzip -l xbpq.jar | grep "\.class" | head -30

      # ========== 3. CFR 反编译 ==========
      - name: Download CFR
        run: |
          curl -fSL -o cfr.jar "https://www.benf.org/other/cfr/cfr-0.152.jar"
          ls -lh cfr.jar

      - name: Decompile
        run: |
          rm -rf out
          mkdir -p out
          java -jar cfr.jar xbpq.jar --outputdir out --silent true --lenient true 2>&1 | tail -30
          echo "=== 退出码: $? ==="
          echo ""
          echo "=== out 目录 ==="
          ls -la out/ || echo "❌ out 不存在"
          echo ""
          echo "=== Java 文件数 ==="
          find out -name "*.java" | wc -l
          echo ""
          echo "=== Java 文件列表 ==="
          find out -name "*.java" | head -50
          echo ""
          echo "=== out 目录大小 ==="
          du -sh out/

      # ========== 4. 打包 ==========
      - name: Zip and upload
        run: |
          if [ -d "out" ] && [ "$(find out -name '*.java' | wc -l)" -gt 0 ]; then
            zip -r decompiled.zip out
            ls -lh decompiled.zip
          else
            echo "❌ out 是空的，无法打包"
            echo "empty" > EMPTY.txt
            zip decompiled.zip EMPTY.txt
          fi

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: diagnose-${{ github.run_id }}
          path: decompiled.zip
          retention-days: 7
