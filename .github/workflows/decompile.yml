name: Decompile xbpq

on:
  push:
    paths:
      - '**/*.jar'
      - '.github/workflows/decompile.yml'
  workflow_dispatch:
    inputs:
      jar_file:
        description: '要反编译的 JAR 文件名'
        required: false
        default: 'xbpq.jar'
      output_dir:
        description: '输出目录（留空自动生成）'
        required: false
        default: ''

permissions:
  contents: write

env:
  CFR_VERSION: '0.152'
  DEX2JAR_VERSION: '2.4'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      jar_file: ${{ steps.find.outputs.jar_file }}
      out_dir: ${{ steps.find.outputs.out_dir }}
      is_manual: ${{ steps.find.outputs.is_manual }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Find JAR
        id: find
        run: |
          set -e
          if [ -n "${{ github.event.inputs.jar_file }}" ]; then
            JAR="${{ github.event.inputs.jar_file }}"
            OUT="${{ github.event.inputs.output_dir }}"
            IS_MANUAL=true
          else
            if [ -f "xbpq.jar" ]; then
              JAR="xbpq.jar"
            else
              JAR=$(find . -maxdepth 2 -name "*.jar" ! -path "./tools/*" ! -path "./.git/*" | head -1)
            fi
            OUT=""
            IS_MANUAL=false
          fi
          [ -f "$JAR" ] || { echo "❌ 找不到 $JAR"; exit 1; }
          [ -z "$OUT" ] && OUT="$(basename "$JAR" .jar)-src"
          echo "jar_file=$JAR" >> $GITHUB_OUTPUT
          echo "out_dir=$OUT" >> $GITHUB_OUTPUT
          echo "is_manual=$IS_MANUAL" >> $GITHUB_OUTPUT
          echo "📦 JAR: $JAR"
          echo "📁 输出: $OUT"

  decompile:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAR_FILE: ${{ needs.detect.outputs.jar_file }}
      OUT_DIR: ${{ needs.detect.outputs.out_dir }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup
        run: |
          mkdir -p tools
          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV
          echo "OUT_DIR=$OUT_DIR" >> $GITHUB_ENV

      # ---------- 1. 校验 JAR ----------
      - name: Validate JAR
        id: validate
        run: |
          set -e
          [ -f "$JAR_FILE" ] || { echo "❌ 找不到 JAR"; exit 1; }
          SIZE=$(stat -c%s "$JAR_FILE")
          echo "大小: $SIZE bytes"
          CLASS_COUNT=$(unzip -l "$JAR_FILE" | grep -c '\.class$' || true)
          DEX_COUNT=$(unzip -l "$JAR_FILE" | grep -c '\.dex$' || true)
          NESTED_COUNT=$(unzip -l "$JAR_FILE" | grep -c '\.jar$' || true)
          echo "class: $CLASS_COUNT"
          echo "dex:   $DEX_COUNT"
          echo "nested: $NESTED_COUNT"
          echo "class_count=$CLASS_COUNT" >> $GITHUB_OUTPUT
          echo "dex_count=$DEX_COUNT" >> $GITHUB_OUTPUT
          echo "nested_count=$NESTED_COUNT" >> $GITHUB_OUTPUT

      # ---------- 2. 判断类型 ----------
      - name: Decide target
        id: decide
        run: |
          CLASS_COUNT="${{ steps.validate.outputs.class_count }}"
          DEX_COUNT="${{ steps.validate.outputs.dex_count }}"
          if [ "$CLASS_COUNT" -gt 0 ]; then
            echo "type=class" >> $GITHUB_OUTPUT
            echo "✅ 是标准 JVM class 格式"
          elif [ "$DEX_COUNT" -gt 0 ]; then
            echo "type=dex" >> $GITHUB_OUTPUT
            echo "✅ 是 Android DEX 格式"
          else
            echo "type=unknown" >> $GITHUB_OUTPUT
            echo "❌ 无法识别格式"
            exit 1
          fi

      # ---------- 3. 如果是 DEX，转 JAR ----------
      - name: Download dex2jar
        if: steps.decide.outputs.type == 'dex'
        run: |
          set -e
          curl -fSL --retry 3 -o tools/dex2jar.zip \
            "https://github.com/pxb1988/dex2jar/releases/download/v${DEX2JAR_VERSION}/dex-tools-v${DEX2JAR_VERSION}.zip"
          unzip -q tools/dex2jar.zip -d tools/
          find tools -name "d2j-dex2jar.sh" -exec chmod +x {} \;
          echo "✅ dex2jar 下载完成"

      - name: Convert DEX to JAR
        id: dex2jar
        if: steps.decide.outputs.type == 'dex'
        run: |
          set -e
          rm -rf dex_extract
          mkdir -p dex_extract
          cd dex_extract
          unzip -o "../$JAR_FILE" "*.dex" || unzip -o "../$JAR_FILE"
          cd ..
          DEX_FILES=$(find dex_extract -name "*.dex")
          echo "找到 DEX: $DEX_FILES"
          D2J=$(find tools -name "d2j-dex2jar.sh" | head -1)
          chmod +x "$D2J"
          rm -f xbpq-classes.jar
          bash "$D2J" $(echo $DEX_FILES | head -1) -o xbpq-classes.jar --force
          ls -lh xbpq-classes.jar
          echo "class 数: $(unzip -l xbpq-classes.jar | grep -c '\.class$' || true)"
          echo "converted=true" >> $GITHUB_OUTPUT

      # ---------- 4. 下载 CFR ----------
      - name: Download CFR
        id: cfr
        run: |
          set -e
          URLS=(
            "https://www.benf.org/other/cfr/cfr-${CFR_VERSION}.jar"
            "https://github.com/leibnitz27/cfr/releases/download/${CFR_VERSION}/cfr-${CFR_VERSION}.jar"
            "https://repo1.maven.org/maven2/org/benf/cfr/${CFR_VERSION}/cfr-${CFR_VERSION}.jar"
          )
          for url in "${URLS[@]}"; do
            echo "尝试: $url"
            if curl -fSL --retry 3 --retry-delay 2 -o tools/cfr.jar "$url" && [ -s tools/cfr.jar ]; then
              echo "cfr_ok=true" >> $GITHUB_OUTPUT
              echo "✅ CFR 下载成功"
              exit 0
            fi
          done
          echo "cfr_ok=false" >> $GITHUB_OUTPUT
          echo "❌ CFR 下载失败"

      # ---------- 5. 选目标 ----------
      - name: Choose target
        id: target
        run: |
          if [ "${{ steps.dex2jar.outputs.converted }}" = "true" ] && [ -f "xbpq-classes.jar" ]; then
            echo "target=xbpq-classes.jar" >> $GITHUB_OUTPUT
            echo "✅ 使用转换后的 JAR"
          else
            echo "target=$JAR_FILE" >> $GITHUB_OUTPUT
            echo "✅ 使用原 JAR"
          fi

      # ---------- 6. CFR 反编译（最简参数，不报错） ----------
      - name: Decompile with CFR
        id: cfr_decompile
        if: steps.cfr.outputs.cfr_ok == 'true'
        continue-on-error: true
        run: |
          set -e
          TARGET="${{ steps.target.outputs.target }}"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          echo "=== 反编译 $TARGET ==="
          java -Xmx4g -jar tools/cfr.jar "$TARGET" --outputdir "$OUT_DIR" --silent true || echo "CFR 有警告"
          COUNT=$(find "$OUT_DIR" -name "*.java" | wc -l)
          echo "CFR 文件数: $COUNT"
          echo "cfr_count=$COUNT" >> $GITHUB_OUTPUT

      # ---------- 7. 如果 CFR 失败，用 Procyon ----------
      - name: Download Procyon
        id: procyon
        if: steps.cfr_decompile.outputs.cfr_count == '0'
        continue-on-error: true
        run: |
          set -e
          curl -fSL -o tools/procyon.jar \
            "https://github.com/mstrobel/procyon/releases/download/v0.6.0/procyon-decompiler-0.6.0.jar" || exit 0
          echo "procyon_ok=true" >> $GITHUB_OUTPUT

      - name: Decompile with Procyon
        id: procyon_decompile
        if: steps.procyon.outputs.procyon_ok == 'true'
        continue-on-error: true
        run: |
          set -e
          TARGET="${{ steps.target.outputs.target }}"
          rm -rf "${OUT_DIR}_procyon"
          mkdir -p "${OUT_DIR}_procyon"
          java -Xmx4g -jar tools/procyon.jar -jar "$TARGET" -o "${OUT_DIR}_procyon" || true
          echo "Procyon 文件数: $(find "${OUT_DIR}_procyon" -name '*.java' 2>/dev/null | wc -l)"

      # ---------- 8. 选最佳 ----------
      - name: Pick best
        id: pick
        run: |
          set -e
          BEST=""
          BEST_SCORE=-999999
          for dir in "$OUT_DIR" "${OUT_DIR}_procyon"; do
            if [ -d "$dir" ]; then
              COUNT=$(find "$dir" -name '*.java' | wc -l)
              UNSUP=$(grep -rl "UnsupportedOperationException" "$dir" 2>/dev/null | wc -l || true)
              SCORE=$((COUNT - UNSUP * 10))
              echo "$dir: count=$COUNT unsup=$UNSUP score=$SCORE"
              if [ "$SCORE" -gt "$BEST_SCORE" ]; then
                BEST="$dir"
                BEST_SCORE="$SCORE"
              fi
            fi
          done
          [ -n "$BEST" ] || { echo "❌ 没结果"; exit 1; }
          echo "best_dir=$BEST" >> $GITHUB_OUTPUT
          if [ "$BEST" != "$OUT_DIR" ]; then
            rm -rf "${OUT_DIR}_old"
            mv "$OUT_DIR" "${OUT_DIR}_old" 2>/dev/null || true
            cp -r "$BEST" "$OUT_DIR"
          fi

      # ---------- 9. 深度检查 ----------
      - name: Deep check
        id: deep
        run: |
          set -e
          echo "=== Java 文件总数: $(find "$OUT_DIR" -name '*.java' | wc -l) ==="
          echo "=== 前 50 个 Java 文件 ==="
          find "$OUT_DIR" -name "*.java" | head -50
          echo ""
          echo "=== 是否含 XBPQ.java ==="
          XBPQ_FILE=$(find "$OUT_DIR" -name "XBPQ.java" | head -1)
          if [ -z "$XBPQ_FILE" ]; then
            echo "❌ 找不到 XBPQ.java"
            echo "found=false" >> $GITHUB_OUTPUT
            echo ""
            echo "=== 全部 spider 相关类 ==="
            find "$OUT_DIR" -path "*spider*" -name "*.java" | head -50
            exit 0
          fi
          LINES=$(wc -l < "$XBPQ_FILE")
          UNSUP=$(grep -c "UnsupportedOperationException" "$XBPQ_FILE" || true)
          echo "📄 XBPQ.java: $LINES 行, $UNSUP 处缺失"
          echo "found=true" >> $GITHUB_OUTPUT
          echo "xbpq_file=$XBPQ_FILE" >> $GITHUB_OUTPUT
          echo "xbpq_lines=$LINES" >> $GITHUB_OUTPUT
          echo "xbpq_unsup=$UNSUP" >> $GITHUB_OUTPUT
          echo ""
          echo "=== 关键方法 ==="
          for m in "W(" "detailContent(" "playerContent(" "searchContent(" "homeContent(" "categoryContent("; do
            grep -q "$m" "$XBPQ_FILE" && echo "✅ $m" || echo "❌ $m"
          done

      # ---------- 10. 报告 ----------
      - name: Report
        if: always()
        run: |
          {
            echo "# Decompile Report"
            echo ""
            echo "## 触发"
            echo "- 方式: ${{ needs.detect.outputs.is_manual == 'true' && '手动' || '自动' }}"
            echo "- JAR: \`$JAR_FILE\`"
            echo ""
            echo "## 输入"
            echo "- 大小: $(stat -c%s "$JAR_FILE" 2>/dev/null || echo N/A) bytes"
            echo "- class 数: ${{ steps.validate.outputs.class_count }}"
            echo "- dex 数: ${{ steps.validate.outputs.dex_count }}"
            echo "- 嵌套 JAR: ${{ steps.validate.outputs.nested_count }}"
            echo "- 类型: ${{ steps.decide.outputs.type }}"
            echo "- DEX 转换: ${{ steps.dex2jar.outputs.converted }}"
            echo ""
            echo "## 输出"
            echo "- 最佳目录: \`${{ steps.pick.outputs.best_dir }}\`"
            echo "- Java 文件数: $(find "$OUT_DIR" -name '*.java' 2>/dev/null | wc -l)"
            echo "- XBPQ.java: ${{ steps.deep.outputs.xbpq_lines }} 行"
            echo "- 缺失方法: ${{ steps.deep.outputs.xbpq_unsup }}"
            echo ""
            echo "## 时间"
            echo "- $(date -u)"
          } > DECOMPILE_REPORT.md
          cat DECOMPILE_REPORT.md

      # ---------- 11. 提交 ----------
      - name: Auto commit
        if: steps.deep.outputs.found == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT_DIR/" DECOMPILE_REPORT.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化"
          else
            MODE="${{ needs.detect.outputs.is_manual == 'true' && '手动' || '自动' }}"
            git commit -m "🤖 [$MODE] 反编译 $JAR_FILE $(date +%Y%m%d_%H%M%S)"
            git push
            echo "✅ 已推送"
          fi

      # ---------- 12. 打包上传 ----------
      - name: Zip
        if: always()
        run: |
          zip -rq decompiled.zip "$OUT_DIR" DECOMPILE_REPORT.md 2>/dev/null || true
          ls -lh decompiled.zip || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: decompiled-${{ github.run_id }}
          path: |
            decompiled.zip
            DECOMPILE_REPORT.md
          retention-days: 30

      - name: Upload XBPQ.java
        if: steps.deep.outputs.found == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: XBPQ-java-${{ github.run_id }}
          path: ${{ steps.deep.outputs.xbpq_file }}
          retention-days: 30
